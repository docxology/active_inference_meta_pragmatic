# Paper Metadata Configuration
# This file contains all configurable metadata for the Active Inference manuscript
# Edit this file to customize your paper's metadata

paper:
  title: "Active Inference as a Meta-Pragmatic Framework"
  subtitle: "Executable Models, Evidence, and the Discipline of Revision"
  version: "1.2"
  cover:
    image: "assets/scientific_graphical_abstract.png"
    alt: "Four defined inquiry roles: Q1 infer and act, Q2 contextualize evidence, Q3 monitor inquiry, and Q4 evaluate and revise. Each card explains its operation; Q means quadrant and the roles overlap rather than forming stages. GNN means Generalized Notation Notation. Lower panels show sensor accuracy with marginal seed intervals and exact action probabilities from expected free energy. The two demonstrations are synthetic; model revision remains subject to researcher evaluation."
  date: "" # Auto-generated if empty (uses current date)

