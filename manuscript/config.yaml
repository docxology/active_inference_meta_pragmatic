  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "" # Not supplied
    affiliations:
      - "Active Inference Institute"
      - "FractiAI"
    orcid_status: "Verified against the public ORCID registry"
    corresponding: true

