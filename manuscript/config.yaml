# Publication rendering uses docxology/template via script 08.
render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false
  html:
    asset_mode: cdn

# Let sections flow rather than leaving isolated continuation pages.
rendering:
  section_breaks: false
  cover_height_fraction: 0.58

# Testing Configuration
testing:
  max_test_failures: 0 # General maximum (default: 0 = strict, no failures allowed)
  max_infra_test_failures: 0 # Infrastructure test suite maximum (default: 0)
  max_project_test_failures: 0 # Project test suite maximum (default: 0)
