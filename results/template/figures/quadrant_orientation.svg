   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #245d87" x="211.789582" y="112.380933" transform="rotate(-0 211.789582 112.380933)">Q1  Infer and act</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(137.347394 138.762095)">What should be believed</text>
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(180.434894 153.165377)">and done?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(109.979894 181.693088)">Update beliefs from observations;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(114.617707 196.09637)">evaluate actions under a model.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #535d63" x="211.789582" y="236.880813" transform="rotate(-0 211.789582 236.880813)">Failure: misspecified likelihood</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #236e66" x="475.943218" y="112.380933" transform="rotate(-0 475.943218 112.380933)">Q2  Contextualize evidence</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(414.885718 138.762095)">Which source model</text>
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(435.209781 153.165377)">is warranted?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(384.420718 181.693088)">Condition on source reliability;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(375.138531 196.09637)">examine the context of evidence.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #535d63" x="475.943218" y="236.880813" transform="rotate(-0 475.943218 236.880813)">Failure: unreliable metadata</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #916133" x="211.789582" y="309.863501" transform="rotate(-0 211.789582 309.863501)">Q3  Monitor inquiry</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(160.201769 336.244664)">Is more evidence</text>
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(167.998957 350.647945)">worth its cost?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(125.548019 379.175657)">Assess uncertainty and cost;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(124.863644 393.578938)">regulate further observation.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #535d63" x="211.789582" y="434.363381" transform="rotate(-0 211.789582 434.363381)">Failure: confident early stopping</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b5289" x="475.943218" y="309.863501" transform="rotate(-0 475.943218 309.863501)">Q4  Evaluate and revise</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(406.110718 336.244664)">What warrants revising</text>
    <text style="font-style: italic; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(412.692906 350.647945)">these commitments?</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(383.424156 379.175657)">Challenge model assumptions;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(377.737281 393.578938)">justify revisions before adoption.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #535d63" x="475.943218" y="434.363381" transform="rotate(-0 475.943218 434.363381)">Failure: unjustified model change</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="211.789582" y="35.105146" transform="rotate(-0 211.789582 35.105146)">TASK EVIDENCE</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="475.943218" y="35.105146" transform="rotate(-0 475.943218 35.105146)">EVIDENCE ABOUT ITS SOURCE</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(36.214603 248.022162) rotate(-90)">INFERENCE IN A MODEL</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(36.214603 450.10973) rotate(-90)">REGULATION OF INQUIRY</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(164.535775 471.477292)">Roles may overlap. This map does not establish a hierarchy</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(167.9164 485.880573)">of cognitive faculties or guarantee improved performance.</text>
   </g>
  </g>
 </g>
